[package]
name = "weixin-reader"
version = "1.5.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "weixin-reader"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "weixin_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["test"] }
tauri-plugin-opener = "2.5"
tauri-plugin-window-state = "2.4"
tauri-plugin-log = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.10"
tokio = { version = "1", features = ["time"] }
log = "0.4"
zip = "2.2"
tauri-plugin-dialog = "2.7"
sha2 = "0.10"
sha1 = "0.10"
encoding_rs = "0.8"
percent-encoding = "2"
roxmltree = "0.20"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-global-shortcut = "2.3"

[[bin]]
name = "weixin-reader"
path = "src/main.rs"

[profile.release]
panic = "abort" # Strip panic unwind tables
codegen-units = 1 # Compile all in one unit for better optimization
lto = true # Enable Link Time Optimization
opt-level = "z" # Optimize for size
strip = true # Strip symbols from binary
