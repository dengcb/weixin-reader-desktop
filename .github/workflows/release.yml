name: Windows Release Bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, for example v1.1.0
        required: true
        type: string
      signing-policy:
        description: SignPath signing policy
        required: false
        default: release-signing
        type: choice
        options:
          - release-signing
          - test-signing

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate-release:
    name: Validate tag and draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Validate version, tag, and draft release
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(jq -r '.version' package.json)"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "tag ${RELEASE_TAG} does not match package.json (${expected_tag})" >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          tagged_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          if [[ "${commit}" != "${tagged_commit}" ]]; then
            echo "checkout commit does not match tag commit" >&2
            exit 1
          fi
          draft_count="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq --arg tag "${RELEASE_TAG}" '[.[] | select(.tag_name == $tag and .draft == true)] | length'
          )"
          if [[ "${draft_count}" != "1" ]]; then
            echo "${RELEASE_TAG} must have an existing draft release" >&2
            exit 1
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

  windows-nsis-x64:
    name: Windows x64 NSIS
    needs: validate-release
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    environment: windows-release
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Check SignPath availability
        id: check-signpath
        env:
          SIGNPATH_TOKEN: '${{ secrets.SIGNPATH_API_TOKEN }}'
        shell: bash
        run: |
          if [ -n "$SIGNPATH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "SignPath signing enabled"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SignPath signing skipped (no API token)"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache build inputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-release-x86_64-pc-windows-msvc-${{ hashFiles('bun.lock', 'src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate local release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.commit }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download $env:RELEASE_TAG --pattern release-metadata.json --dir release
          $metadata = Get-Content release/release-metadata.json -Raw | ConvertFrom-Json
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($metadata.version -ne $version) { throw 'release metadata version mismatch' }
          if ($metadata.tag -ne $env:RELEASE_TAG) { throw 'release metadata tag mismatch' }
          if ($metadata.commit -ne $env:EXPECTED_COMMIT) { throw 'release metadata commit mismatch' }

      - name: Build one native NSIS bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles nsis --target x86_64-pc-windows-msvc -- --locked

      - name: Standardize, sign-check, and size-check assets
        env:
          GITHUB_SHA: ${{ needs.validate-release.outputs.commit }}
          STAGE_TARGET: x86_64-pc-windows-msvc
        shell: pwsh
        run: |
          bun scripts/stage-windows-release.ts

      # SignPath Authenticode 签名（Secret 未配置时自动跳过，回退到 NotSigned）
      # NSIS 安装包在 Windows 上未签名时会触发 SmartScreen "未知发布者" 警告。
      # SignPath Foundation 为 OSS 项目提供免费代码签名证书。
      - name: Upload unsigned installer as GitHub artifact
        if: steps.check-signpath.outputs.available == 'true'
        id: upload-unsigned-x64
        uses: actions/upload-artifact@v4
        with:
          name: weixin-reader-x64-unsigned
          path: release/windows/*-x86_64-setup.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.check-signpath.outputs.available == 'true'
        id: signpath-x64
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'weixin-reader-desktop'
          signing-policy-slug: '${{ inputs.signing-policy }}'
          github-artifact-id: '${{ steps.upload-unsigned-x64.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'release/windows-signed'

      - name: Finalize installer (signed or unsigned) and compute hashes
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/windows/*-x86_64-setup.exe -File
          # 如果 SignPath 签名成功，用签名后的文件替换原始文件
          $signedDir = 'release/windows-signed'
          if (Test-Path $signedDir) {
            $signed = Get-ChildItem "$signedDir/*-x86_64-setup.exe" -File
            if ($signed) {
              Copy-Item $signed.FullName $installer.FullName -Force
              Write-Host "Replaced with SignPath signed installer"
            }
          }
          # 计算 SHA256 + Authenticode 状态
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $authenticode = (Get-AuthenticodeSignature $installer.FullName).Status.ToString()
          $infoPath = 'release/windows/windows-x86_64-release-info.json'
          $info = Get-Content $infoPath -Raw | ConvertFrom-Json
          $info.installerSha256 = $hash
          $info.authenticodeStatus = $authenticode
          $info | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8NoBOM $infoPath
          Write-Host "Authenticode: $authenticode"
          Write-Host "SHA256: $hash"

      - name: Upload only to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $drafts = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG -and $_.draft -eq $true })
          if ($drafts.Count -ne 1) { throw 'release is no longer a draft' }
          Get-ChildItem release/windows -File | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($_.Name)" }
          }
          gh release view $env:RELEASE_TAG --json url,isDraft,assets

  windows-nsis-arm64:
    name: Windows ARM64 NSIS
    needs: validate-release
    runs-on: windows-11-arm
    timeout-minutes: 45
    permissions:
      contents: write
    environment: windows-release
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Check SignPath availability
        id: check-signpath
        env:
          SIGNPATH_TOKEN: '${{ secrets.SIGNPATH_API_TOKEN }}'
        shell: bash
        run: |
          if [ -n "$SIGNPATH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "SignPath signing enabled"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SignPath signing skipped (no API token)"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache build inputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-release-aarch64-pc-windows-msvc-${{ hashFiles('bun.lock', 'src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate local release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.commit }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download $env:RELEASE_TAG --pattern release-metadata.json --dir release
          $metadata = Get-Content release/release-metadata.json -Raw | ConvertFrom-Json
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($metadata.version -ne $version) { throw 'release metadata version mismatch' }
          if ($metadata.tag -ne $env:RELEASE_TAG) { throw 'release metadata tag mismatch' }
          if ($metadata.commit -ne $env:EXPECTED_COMMIT) { throw 'release metadata commit mismatch' }

      - name: Build native ARM64 NSIS bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles nsis --target aarch64-pc-windows-msvc -- --locked

      - name: Standardize, sign-check, and size-check assets
        env:
          GITHUB_SHA: ${{ needs.validate-release.outputs.commit }}
          STAGE_TARGET: aarch64-pc-windows-msvc
        shell: pwsh
        run: |
          bun scripts/stage-windows-release.ts

      # SignPath Authenticode 签名（与 x64 job 完全对称）
      - name: Upload unsigned installer as GitHub artifact
        if: steps.check-signpath.outputs.available == 'true'
        id: upload-unsigned-arm64
        uses: actions/upload-artifact@v4
        with:
          name: weixin-reader-arm64-unsigned
          path: release/windows/*-aarch64-setup.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.check-signpath.outputs.available == 'true'
        id: signpath-arm64
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'weixin-reader-desktop'
          signing-policy-slug: '${{ inputs.signing-policy }}'
          github-artifact-id: '${{ steps.upload-unsigned-arm64.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'release/windows-signed'

      - name: Finalize installer (signed or unsigned) and compute hashes
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/windows/*-aarch64-setup.exe -File
          # 如果 SignPath 签名成功，用签名后的文件替换原始文件
          $signedDir = 'release/windows-signed'
          if (Test-Path $signedDir) {
            $signed = Get-ChildItem "$signedDir/*-aarch64-setup.exe" -File
            if ($signed) {
              Copy-Item $signed.FullName $installer.FullName -Force
              Write-Host "Replaced with SignPath signed installer"
            }
          }
          # 计算 SHA256 + Authenticode 状态
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $authenticode = (Get-AuthenticodeSignature $installer.FullName).Status.ToString()
          $infoPath = 'release/windows/windows-aarch64-release-info.json'
          $info = Get-Content $infoPath -Raw | ConvertFrom-Json
          $info.installerSha256 = $hash
          $info.authenticodeStatus = $authenticode
          $info | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8NoBOM $infoPath
          Write-Host "Authenticode: $authenticode"
          Write-Host "SHA256: $hash"

      - name: Upload ARM64 assets to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $drafts = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG -and $_.draft -eq $true })
          if ($drafts.Count -ne 1) { throw 'release is no longer a draft' }
          Get-ChildItem release/windows -File | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "failed to upload $($_.Name)" }
          }
          gh release view $env:RELEASE_TAG --json url,isDraft,assets
