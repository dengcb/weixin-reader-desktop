<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地书架 - 艾特阅读</title>
  <style>
    :root {
      color-scheme: light dark;
      /* 深浅双主题：浅色纸白 / 深色墨底，品牌色不变（DESIGN_TOKENS #349f66） */
      --paper: #f7f7f5;
      --ink: #1f2329;
      --muted: #8a8f85;
      --line: rgba(31, 35, 41, .08);
      --field: #ececea;
      --field-ink: #55595e;
      --pill: #ececea;
      --pill-hover: #e2e2df;
      --accent: #349f66;
      --danger: #c0392b;
      --halo: rgba(52, 159, 102, .1);
      --topbar-bg: rgba(247, 247, 245, .86);
      --cover-shadow: 0 4px 14px rgba(0, 0, 0, .16);
      --cover-shadow-hover: 0 12px 26px rgba(0, 0, 0, .2);
      --scroll-thumb: rgba(31, 35, 41, .28);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #17181a;
        --ink: #e8eaec;
        --muted: #989d9e;
        --line: rgba(232, 234, 236, .09);
        --field: #232529;
        --field-ink: #b6bbbd;
        --pill: #232529;
        --pill-hover: #2e3136;
        --danger: #c2544a;
        --halo: rgba(96, 195, 142, .08);
        --topbar-bg: rgba(23, 24, 26, .86);
        --cover-shadow: 0 4px 14px rgba(0, 0, 0, .5);
        --cover-shadow-hover: 0 12px 26px rgba(0, 0, 0, .6);
        --scroll-thumb: rgba(232, 234, 236, .3);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -10rem, var(--halo), transparent 30rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      overflow-y: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 滚动条静止时隐形、滚动期间显形（与设置页同款 is-scrolling 模式） */
    body::-webkit-scrollbar { width: 12px; height: 12px; }
    body::-webkit-scrollbar-track, body::-webkit-scrollbar-corner { background: transparent; }
    body::-webkit-scrollbar-thumb {
      background-color: transparent;
      border: 3px solid transparent;
      border-radius: 8px;
      background-clip: content-box;
    }
    body.is-scrolling::-webkit-scrollbar-thumb { background-color: var(--scroll-thumb); }

    /* 沉浸滚动：向下滚动藏上下栏（顶栏上移、内容上提 60px、管理状态栏沉底），
       向上滚动或回到顶部时出栏。transform 动画走合成器，不触发布局重排。 */
    .topbar, main, .manage-bar { transition: transform .25s ease; }
    body.bars-hidden .topbar { transform: translateY(-100%); }
    body.bars-hidden main { transform: translateY(-60px); }
    body.bars-hidden .manage-bar { transform: translateY(100%); }

    /* ---- 顶栏：品牌 / 居中搜索 / 导入入口（同微信读书书架布局） ---- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr minmax(240px, 400px) 1fr;
      align-items: center;
      gap: 16px;
      height: 60px;
      padding: 0 28px;
      background: var(--topbar-bg);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      flex: none;
      background: var(--accent);
      -webkit-mask: url('/atrd-logo.svg') center / contain no-repeat;
      mask: url('/atrd-logo.svg') center / contain no-repeat;
    }
    .brand-name { font-size: 16px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--field);
      color: var(--field-ink);
    }
    .search svg { width: 15px; height: 15px; flex: none; }
    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      /* body 全局 user-select:none 下显式恢复输入框文本可选可编辑 */
      user-select: text;
      -webkit-user-select: text;
    }
    .search input::placeholder { color: var(--muted); }
    .topbar-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .pill {
      border: 0;
      padding: 9px 18px;
      border-radius: 999px;
      background: var(--pill);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s ease, transform .12s ease;
    }
    .pill:hover { background: var(--pill-hover); }
    .pill:active { transform: scale(.97); }
    .pill:focus-visible { outline: 3px solid rgba(52, 159, 102, .4); outline-offset: 2px; }
    .pill.focused { outline: 3px solid var(--accent); outline-offset: 2px; }
    .pill.danger { background: var(--danger); color: #fff; }
    .pill.danger:disabled { opacity: .35; cursor: default; }
    .pill.danger.armed { filter: brightness(.85); }

    /* ---- 问候区：衬线大标题（微信读书书架的用户名排印） ---- */
    main {
      max-width: 1168px;
      margin: 0 auto;
      padding: 0 32px 48px;
    }
    .greeting { padding: 52px 2px 0; }
    .greeting h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: .05em;
    }
    .greeting .count { margin-left: 10px; color: var(--muted); font-size: 13px; font-weight: 400; letter-spacing: 0; }

    /* ---- 封面网格：居中限宽，观感对齐微信读书书架 ---- */
    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
      gap: 34px 22px;
      padding: 34px 0 0;
    }
    .book {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      outline: none;
      min-width: 0;
    }
    .cover {
      position: relative;
      aspect-ratio: 5 / 7;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, .92);
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
      font-size: 42px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .25);
      /* 内衬细线 + 外投影：占位封面保留纸书质感 */
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .14),
        var(--cover-shadow);
      transition: transform .14s ease, box-shadow .14s ease;
    }
    .cover::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0) 11%),
        linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(0, 0, 0, .08) 88%);
      pointer-events: none;
    }
    /* 内嵌封面：img 始终参与布局（display:none 会让 lazy 加载永不触发），
       加载成功前 opacity 0 占位；缺缓存时 404 → 移除 img 回退渐变占位封面 */
    .cover-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      opacity: 0;
    }
    .cover.has-cover .cover-img { opacity: 1; }
    .cover.has-cover { color: transparent; text-shadow: none; }
    .book:hover .cover {
      transform: translateY(-5px);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), var(--cover-shadow-hover);
    }
    .book:active .cover { transform: translateY(-2px) scale(.985); }
    .book:focus-visible .cover { outline: 3px solid rgba(52, 159, 102, .45); outline-offset: 3px; }
    /* 遥控焦点环：程序 focus() 在 WebKit 不触发 :focus-visible，.focused 类双轨保可见 */
    .book.focused .cover { outline: 3px solid var(--accent); outline-offset: 3px; transform: scale(1.04); }
    .meta { padding: 10px 2px 0; }
    .title {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.45;
      /* 固定占两行：一行放得下的标题第二行留白，同一排卡片标题/副行对齐；
         超两行由 line-clamp 截断出省略号 */
      height: calc(1.45em * 2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sub { margin-top: 4px; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .noresult {
      padding: 84px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .04em;
    }

    /* ---- 空书架：居中引导（脱敏版默认入口即此页） ---- */
    .empty {
      padding: 120px 0 90px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .05em;
    }
    .empty .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      background: var(--accent);
      -webkit-mask: url('/atrd-logo.svg') center / contain no-repeat;
      mask: url('/atrd-logo.svg') center / contain no-repeat;
    }
    .empty h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .06em;
    }
    .empty .pill { margin-top: 26px; }

    /* ---- 管理模式：封面右上角选择角标，选中封面压暗 ---- */
    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .92);
      background: rgba(0, 0, 0, .25);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
      display: none;
    }
    .book.managing .badge { display: block; }
    .book.selected .badge { background: var(--accent); }
    .book.selected .badge::after {
      content: '✓';
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .book.selected .cover::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: inherit;
      background: rgba(0, 0, 0, .3);
    }
    .book.managing { cursor: pointer; }

    /* ---- 底部管理操作栏 ---- */
    .manage-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 28px;
      background: var(--topbar-bg);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
    }
    /* display:flex 会掀翻 UA 的 [hidden]{display:none}：没有这条，管理栏在
       普通模式常驻底部（曾表现为「底部状态栏」遮住最后一行的信息行） */
    .manage-bar[hidden] { display: none; }
    .bar-select {
      border: 0;
      padding: 6px 2px;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .bar-select:focus-visible { outline: 3px solid rgba(52, 159, 102, .4); outline-offset: 2px; }
    .bar-select.focused { outline: 3px solid var(--accent); outline-offset: 2px; }
    .bar-count { flex: 1; color: var(--muted); font-size: 12.5px; }
    body.managing main { padding-bottom: 112px; }

    @media (prefers-reduced-motion: reduce) {
      .cover, .pill { transition: none; }
    }
    /* 书籍右键菜单：修改名称 / 修改封面 / 恢复默认 */
    .book-ctx { position: fixed; z-index: 60; min-width: 152px; padding: 6px; border-radius: 12px;
      background: var(--topbar-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--line); box-shadow: 0 14px 34px rgba(0, 0, 0, .18); }
    .book-ctx button { display: block; width: 100%; padding: 8px 12px; border: 0; border-radius: 8px;
      background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
    .book-ctx button:hover { background: var(--pill-hover); }
    .book-ctx button.danger { color: var(--danger); }
    .book-ctx .sep { height: 1px; margin: 5px 8px; background: var(--line); }
    /* 行内改名输入框（沿用标题行样式） */
    .title-input { width: 100%; box-sizing: border-box; padding: 3px 6px; margin: -3px -6px;
      border: 1px solid var(--accent); border-radius: 6px; background: var(--field); color: var(--ink);
      font: inherit; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">艾特阅读</span>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.6-3.6"></path>
      </svg>
      <input id="search" type="text" placeholder="在书架中搜索" aria-label="搜索本地图书" spellcheck="false">
    </label>
    <div class="topbar-actions">
      <button type="button" class="pill" id="manageBtn">管理</button>
      <button type="button" class="pill" id="importBtn">导入图书</button>
    </div>
  </header>
  <main>
    <section class="greeting">
      <h1>本地书架 <span class="count" id="shelfCount"></span></h1>
    </section>
    <section class="shelf" id="shelf"></section>
    <div class="noresult" id="noresult" hidden></div>
    <div class="empty" id="empty" hidden>
      <div class="mark" aria-hidden="true"></div>
      <h2>书架还是空的</h2>
      把 TXT / EPUB / MOBI / PDF 拖进窗口即可上架
      <br>
      <button type="button" class="pill" id="emptyImportBtn">导入本地图书</button>
    </div>
  </main>
  <div class="manage-bar" id="manageBar" hidden>
    <button type="button" class="bar-select" id="selectAllBtn">全选</button>
    <span class="bar-count" id="manageCount">已选 0 本</span>
    <button type="button" class="pill danger" id="removeBtn" disabled>移除</button>
  </div>
  <script>
    const invoke = window.__TAURI__?.core?.invoke;
    // 从阅读页进入时窗口标题还停留在旧书名：JS 设置 document.title 触发壳同步，
    // 同时直接调 set_title 双保险
    document.title = '本地书架 - 艾特阅读';
    void invoke?.('set_title', { title: '本地书架 - 艾特阅读' })?.catch?.(() => {});
    // 封面占位：按书名稳定取色（微信读书书架观感），无真实封面文件可渲染
    const PALETTES = [
      ['#b3382e', '#7e1f18'], ['#2e5e8f', '#1c3d60'], ['#4a7a2c', '#2e521a'],
      ['#8a5a2c', '#5e3a18'], ['#6b4fa0', '#463172'], ['#a0425e', '#6e2a40'],
      ['#2c7f78', '#1a5550'], ['#a07a2c', '#6e531b'], ['#3a5a9f', '#24396b'],
      ['#7f3550', '#571f34'],
    ];
    const coverStyle = (title) => {
      let hash = 0;
      for (const ch of title) hash = (hash * 31 + ch.codePointAt(0)) >>> 0;
      const [from, to] = PALETTES[hash % PALETTES.length];
      return `background:linear-gradient(150deg, ${from}, ${to});`;
    };
    const formatLabel = (value) => String(value || '').toUpperCase();

    const relativeTime = (millis) => {
      if (!millis) return '';
      const diff = Date.now() - millis;
      // 书籍下信息栏空间有限（不出现省略号），时间描述保持最短
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return `${Math.floor(diff / 60000)} 分钟前`;
      if (diff < 86400000) return `${Math.floor(diff / 3600000)} 小时前`;
      if (diff < 86400000 * 30) return `${Math.floor(diff / 86400000)} 天前`;
      const date = new Date(millis);
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())}`;
    };

    let books = [];

    // ---- 遥控/键盘焦点管理：卡片网格的电视式导航 ----
    // render() 用 replaceChildren 整体重建，焦点必丢；按 bookId 跨渲染找回。
    // 程序 focus() 在 WebKit 不触发 :focus-visible，.focused 类双轨保环可见。
    let focusedBookId = null;
    const getCards = () => [...document.querySelectorAll('#shelf .book')];
    // 元素在滚动内容里的布局位置（offsetTop 链，不受 transform/过渡影响）
    const layoutY = (el) => {
      let y = 0;
      for (let node = el; node && node !== document.body; node = node.offsetParent) y += node.offsetTop;
      return y;
    };
    const setFocus = (el) => {
      document.querySelectorAll('.focused').forEach((node) => node.classList.remove('focused'));
      if (!el) return;
      el.classList.add('focused');
      el.focus();
      // 焦点进底部管理栏（管理模式 ↓ 到底）：栏可能正被沉浸滚动收起，强制出栏
      if (el === selectAllBtn || el === removeBtn) {
        document.body.classList.remove('bars-hidden');
        return;
      }
      // 滚动跟随只对网格卡片；底栏是 fixed 定位，不做滚动目标
      if (el.classList.contains('book')) {
        focusedBookId = el.dataset.bookId ?? null;
        // 不用 scrollIntoView：它只认滚动视口边界，看不见 sticky 顶栏/管理底栏
        // 这类悬浮层；且沉浸模式的 main transform 让实时 rect 在过渡期不可信。
        // 直接按布局位置算目标 scrollTop（最小让位：焦点卡片刚进屏即停）
        const y = layoutY(el);
        const topH = document.querySelector('.topbar')?.offsetHeight ?? 0;
        const bottomEdge = manageBar.hidden
          ? window.innerHeight
          : window.innerHeight - manageBar.offsetHeight;
        const top = document.body.scrollTop;
        if (y < top + topH) document.body.scrollTop = Math.max(0, y - topH);
        else if (y + el.offsetHeight > top + bottomEdge) {
          document.body.scrollTop = y + el.offsetHeight - bottomEdge;
        }
      }
    };
    const restoreFocus = () => {
      // 搜索/改名输入中不抢焦点（applyFilter 每次击键都会重建网格）
      if (document.activeElement instanceof HTMLInputElement) return;
      const cards = getCards();
      if (!cards.length) {
        setFocus(document.getElementById('emptyImportBtn'));
        return;
      }
      setFocus(cards.find((card) => card.dataset.bookId === focusedBookId) ?? cards[0]);
    };
    // 鼠标点击获得焦点的卡片（WebView2 会聚焦按钮）同步进遥控焦点状态
    document.addEventListener('focusin', (event) => {
      const card = event.target?.closest?.('.book');
      if (!card?.dataset?.bookId) return;
      focusedBookId = card.dataset.bookId;
      document.querySelectorAll('.book.focused').forEach((node) => node.classList.remove('focused'));
      card.classList.add('focused');
    });
    // auto-fill 网格每行等列：与首卡同一 offsetTop（±4px 容差）的卡片数即列数
    const gridColumns = (cards) => {
      const first = cards[0]?.offsetTop ?? 0;
      let cols = 0;
      for (const card of cards) {
        if (Math.abs(card.offsetTop - first) <= 4) cols += 1;
        else break;
      }
      return Math.max(1, cols);
    };
    const rowHeight = (cards, cols) =>
      cards.length > cols ? Math.max(1, cards[cols].offsetTop - cards[0].offsetTop) : 1;
    // 遥控 ↑↓ 经系统映射是 PageUp/PageDown（HID 键盘页翻页键），与物理方向键同义
    const navigateGrid = (key) => {
      const active = document.activeElement;
      if (active === selectAllBtn || active === removeBtn) {
        // 底部管理栏：←→在两钮间切换、↑回网格（已是最后一层，↓不前进）；
        // 遥控 ↑↓ 即 PageUp/PageDown，两种键名同认
        if (key === 'ArrowLeft' || key === 'ArrowRight') {
          setFocus(active === selectAllBtn ? removeBtn : selectAllBtn);
          return true;
        }
        if (key === 'ArrowUp' || key === 'PageUp') {
          const cards = getCards();
          const from = cards.find((card) => card.dataset.bookId === focusedBookId) ?? cards[cards.length - 1];
          if (from) setFocus(from);
          return true;
        }
        return key === 'ArrowDown' || key === 'PageDown';
      }
      const cards = getCards();
      if (!cards.length) return false;
      const cols = gridColumns(cards);
      const current = cards.findIndex((card) => card.dataset.bookId === focusedBookId);
      const i = current >= 0 ? current : 0;
      let target = i;
      if (key === 'ArrowLeft') target = i - 1;
      else if (key === 'ArrowRight') target = i + 1;
      else if (key === 'ArrowUp' || key === 'PageUp') target = i - cols;
      else if (key === 'ArrowDown' || key === 'PageDown') {
        target = i + cols;
        // 管理模式最后一行再 ↓：进底栏（全选/移除）
        if (manageMode && target > cards.length - 1) {
          setFocus(selectAllBtn);
          return true;
        }
      }
      // 纵向移动即沉浸：向下藏栏、向上出栏——焦点在首屏内移动时页面不滚动、
      // 没有滚动事件可依，必须由焦点方向驱动（曾致顶栏要等首屏滚尽才消失）
      if (key === 'ArrowDown' || key === 'PageDown') document.body.classList.add('bars-hidden');
      else if (key === 'ArrowUp' || key === 'PageUp') document.body.classList.remove('bars-hidden');
      // 越界即停在原地（clamp），仍拦掉原生滚动
      if (target < 0 || target > cards.length - 1) return true;
      if (target !== i) setFocus(cards[target]);
      return true;
    };
    // 音量±：整屏翻页——步长 = 当前视口可见的行数（顶栏实测高度；四舍五入，
    // 半行以上即算一行）。一屏 3 行就跳 3 行，不留重叠行
    const navScreen = (dir) => {
      const cards = getCards();
      if (!cards.length) return;
      const cols = gridColumns(cards);
      const rowH = rowHeight(cards, cols);
      const topH = document.querySelector('.topbar')?.offsetHeight ?? 0;
      const rows = Math.max(1, Math.round((window.innerHeight - topH) / rowH));
      const current = cards.findIndex((card) => card.dataset.bookId === focusedBookId);
      const i = current >= 0 ? current : 0;
      const target = Math.min(cards.length - 1, Math.max(0, i + dir * cols * rows));
      if (target === i) return;
      const card = cards[target];
      setFocus(card);
      // 整页对位：视口与焦点同步翻一整页，而非 setFocus 的最小让位（最小让位
      // 只把焦点行滚进屏底，旧行仍占大半屏）。向前翻目标行对齐顶栏下沿（新页
      // 从焦点行开始），向后翻目标行压底（连续回翻）；书架首尾自然截断
      const y = layoutY(card);
      if (dir > 0) document.body.scrollTop = Math.max(0, y - topH);
      else {
        const bottomEdge = manageBar.hidden
          ? window.innerHeight
          : window.innerHeight - manageBar.offsetHeight;
        document.body.scrollTop = Math.max(0, y + card.offsetHeight - bottomEdge);
      }
      // 整页翻同样由方向驱动沉浸（滚动被首尾截断时不产生滚动事件）
      document.body.classList.toggle('bars-hidden', dir > 0);
    };
    // 主页键：回顶部并聚焦第一张
    const goTop = () => {
      document.body.scrollTop = 0;
      const cards = getCards();
      if (cards.length) setFocus(cards[0]);
    };

    const render = (list, keyword) => {
      const shelf = document.getElementById('shelf');
      const empty = document.getElementById('empty');
      const noresult = document.getElementById('noresult');
      const total = books.length;
      document.getElementById('shelfCount').textContent = `共 ${total} 本`;
      empty.hidden = total > 0;
      shelf.hidden = total === 0 || list.length === 0;
      noresult.hidden = !(total > 0 && list.length === 0);
      if (!noresult.hidden) {
        noresult.textContent = `没有找到与「${keyword}」匹配的书`;
      }
      shelf.replaceChildren();
      for (const book of list) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'book';
        const cover = document.createElement('div');
        cover.className = 'cover';
        cover.style.cssText = coverStyle(book.title);
        cover.textContent = Array.from(book.title)[0] ?? '·';
        const coverImg = document.createElement('img');
        coverImg.className = 'cover-img';
        coverImg.alt = '';
        coverImg.loading = 'lazy';
        coverImg.decoding = 'async';
        coverImg.addEventListener('load', () => cover.classList.add('has-cover'));
        coverImg.addEventListener('error', () => coverImg.remove());
        coverImg.src = `/local-book-cover/${book.bookId}`;
        cover.append(coverImg);
        const meta = document.createElement('div');
        meta.className = 'meta';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = book.title;
        title.title = book.title;
        // 「格式 · 大概百分比 · 最后阅读时间」；无进度时维持原两段式；
        // 清除阅读历史后 lastOpenedAt=0，relativeTime 返回空串，时间自然不显示
        const readAt = relativeTime(book.lastOpenedAt);
        const sub = document.createElement('div');
        sub.className = 'sub';
        const progress = book.progress;
        const percent = progress && Number.isFinite(progress.fraction) && progress.fraction > 0
          ? `${Math.round(progress.fraction * 100)}%` : null;
        const parts = [formatLabel(book.format)];
        if (percent) parts.push(percent);
        if (readAt) parts.push(readAt);
        sub.textContent = parts.join(' · ');
        meta.append(title, sub);
        card.append(cover, meta);
        card.dataset.bookId = book.bookId;
        card.dataset.customized = book.customized ? '1' : '0';
        if (manageMode) {
          card.classList.add('managing');
          if (selected.has(book.bookId)) card.classList.add('selected');
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.setAttribute('aria-hidden', 'true');
          cover.append(badge);
        }
        card.addEventListener('click', (event) => {
          // 行内改名输入框的点击不得触发开书（卡片本身是 button）
          if (event.target?.closest?.('.title-input')) return;
          if (manageMode) {
            toggleSelect(book.bookId, card);
            return;
          }
          void invoke('open_local_book_by_id', { bookId: book.bookId })?.catch?.(() => {});
        });
        shelf.append(card);
      }
      restoreFocus();
    };

    const applyFilter = () => {
      const keyword = document.getElementById('search').value.trim().toLowerCase();
      const list = keyword
        ? books.filter((book) => book.title.toLowerCase().includes(keyword))
        : books;
      render(list, keyword.trim());
    };

    const load = async () => {
      if (!invoke) return;
      try {
        books = await invoke('get_local_books');
        if (!Array.isArray(books)) books = [];
      } catch {
        books = [];
      }
      applyFilter();
    };

    document.getElementById('search').addEventListener('input', applyFilter);

    const importBook = () => {
      void invoke('simulate_menu_click', { action: 'open_local_book' })?.catch?.(() => {});
    };
    document.getElementById('importBtn').addEventListener('click', importBook);
    document.getElementById('emptyImportBtn').addEventListener('click', importBook);

    // ---- 管理模式：选择图书批量移除（记录/进度/缓存/封面删除，源文件保留） ----
    let manageMode = false;
    let confirmRemove = false;
    const selected = new Set();
    const manageBar = document.getElementById('manageBar');
    const manageCount = document.getElementById('manageCount');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const removeBtn = document.getElementById('removeBtn');

    const resetConfirm = () => {
      confirmRemove = false;
      removeBtn.textContent = '移除';
      removeBtn.classList.remove('armed');
    };

    const updateManageBar = () => {
      manageCount.textContent = `已选 ${selected.size} 本`;
      selectAllBtn.textContent =
        books.length > 0 && selected.size === books.length ? '取消全选' : '全选';
      removeBtn.disabled = selected.size === 0;
      if (selected.size === 0) resetConfirm();
    };

    const setManageMode = (on) => {
      manageMode = on;
      selected.clear();
      resetConfirm();
      manageBar.hidden = !on;
      // 进管理模式强制出栏：状态栏（全选/移除）必须立即可见
      if (on) document.body.classList.remove('bars-hidden');
      document.getElementById('manageBtn').textContent = on ? '完成' : '管理';
      document.body.classList.toggle('managing', on);
      updateManageBar();
      applyFilter();
    };

    const toggleSelect = (bookId, card) => {
      if (selected.has(bookId)) {
        selected.delete(bookId);
        card.classList.remove('selected');
      } else {
        selected.add(bookId);
        card.classList.add('selected');
      }
      updateManageBar();
    };

    document.getElementById('manageBtn').addEventListener('click', () => setManageMode(!manageMode));
    selectAllBtn.addEventListener('click', () => {
      const allSelected = books.length > 0 && selected.size === books.length;
      selected.clear();
      if (!allSelected) for (const book of books) selected.add(book.bookId);
      applyFilter();
      updateManageBar();
    });
    removeBtn.addEventListener('click', () => {
      if (!selected.size || !invoke) return;
      // 两段式确认：首次点击变「确认移除」，再次点击执行
      if (!confirmRemove) {
        confirmRemove = true;
        removeBtn.textContent = '确认移除';
        removeBtn.classList.add('armed');
        return;
      }
      const bookIds = [...selected];
      Promise.resolve(invoke('remove_local_books', { bookIds }))
        .then(() => {
          selected.clear();
          resetConfirm();
          updateManageBar();
          return load();
        })
        .then(() => {
          if (!books.length) setManageMode(false);
        })
        .catch(() => {});
    });

    void load();
    // 阅读期间导入的新书在回到书架时补齐
    window.addEventListener('focus', () => { void load(); });

    // 滚动条静止 2 秒后自动隐没（与设置页同款 is-scrolling 模式）；
    // 回到顶部时出栏（主页键/焦点回顶的兜底）。沉浸藏栏/出栏只由焦点移动
    // 方向驱动（navigateGrid/navScreen），不响应鼠标滚动。
    (() => {
      let hideTimer = 0;
      document.body.addEventListener('scroll', () => {
        document.body.classList.add('is-scrolling');
        window.clearTimeout(hideTimer);
        hideTimer = window.setTimeout(() => document.body.classList.remove('is-scrolling'), 2000);
        if (document.body.scrollTop <= 10) document.body.classList.remove('bars-hidden');
      }, { passive: true });
    })();
    // Rust 侧后台补齐历史封面完成后通知刷新（EPUB/MOBI 免重开即出封面）
    window.__TAURI__?.event?.listen?.('local-book-covers-updated', () => { void load(); });

    // 保留应用级快捷键（同默认页）：⌘1~7 切书城、⌘, 设置等
    const isWindows = navigator.userAgent.includes('Windows');
    const windowsActions = {
      ',': 'settings', r: 'refresh', '=': 'zoom_in', '-': 'zoom_out',
      '0': 'zoom_reset', o: 'hide_toolbar',
    };
    const flashHint = (text) => {
      let hint = document.getElementById('shelf-hint');
      if (!hint) {
        hint = document.createElement('div');
        hint.id = 'shelf-hint';
        hint.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%)'
          + ';padding:8px 16px;border-radius:10px;background:rgba(0,0,0,.72);color:#fff'
          + ';font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none';
        document.body.append(hint);
      }
      hint.textContent = text;
      hint.style.opacity = '1';
      clearTimeout(flashHint.timer);
      flashHint.timer = setTimeout(() => { hint.style.opacity = '0'; }, 1800);
    };

    // 书籍右键菜单：修改名称 / 修改封面 / 恢复默认（有自定义时才显示第三项）
    let ctxMenu = null;
    const closeCtxMenu = () => {
      ctxMenu?.remove();
      ctxMenu = null;
      document.removeEventListener('pointerdown', onCtxDismiss, true);
    };
    const onCtxDismiss = (event) => {
      if (ctxMenu && !ctxMenu.contains(event.target)) closeCtxMenu();
    };
    const ctxItem = (label, onClick, danger) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      if (danger) button.className = 'danger';
      button.addEventListener('click', () => { closeCtxMenu(); onClick(); });
      return button;
    };
    const startRename = (card) => {
      const titleEl = card.querySelector('.title');
      if (!titleEl || card.querySelector('.title-input')) return;
      const current = titleEl.textContent || '';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'title-input';
      input.value = current;
      input.maxLength = 120;
      titleEl.textContent = '';
      titleEl.append(input);
      input.focus();
      input.select();
      let done = false;
      const finish = (save) => {
        if (done) return;
        done = true;
        const value = input.value.trim();
        if (save && value && value !== current) {
          invoke('rename_local_book', { bookId: card.dataset.bookId, title: value })
            ?.then?.(() => { void load(); })
            ?.catch?.((error) => { flashHint(`重命名失败：${error}`); void load(); });
          return;
        }
        void load();
      };
      input.addEventListener('keydown', (event) => {
        event.stopPropagation();
        if (event.key === 'Enter') { event.preventDefault(); finish(true); }
        else if (event.key === 'Escape') { event.preventDefault(); finish(false); }
      });
      input.addEventListener('blur', () => finish(false));
    };
    const openCtxMenu = (event, card) => {
      event.preventDefault();
      closeCtxMenu();
      const menu = document.createElement('div');
      menu.className = 'book-ctx';
      menu.append(ctxItem('修改名称…', () => startRename(card)));
      menu.append(ctxItem('修改封面…', () => {
        invoke('set_local_book_cover', { bookId: card.dataset.bookId })
          ?.then?.((applied) => { if (applied) void load(); })
          ?.catch?.((error) => flashHint(`封面修改失败：${error}`));
      }));
      if (card.dataset.customized === '1') {
        const sep = document.createElement('div');
        sep.className = 'sep';
        menu.append(sep);
        menu.append(ctxItem('恢复默认', () => {
          invoke('reset_local_book_customization', { bookId: card.dataset.bookId })
            ?.then?.(() => { void load(); })
            ?.catch?.((error) => flashHint(`恢复失败：${error}`));
        }, true));
      }
      document.body.append(menu);
      const rect = menu.getBoundingClientRect();
      const left = Math.min(event.clientX, window.innerWidth - rect.width - 8);
      const top = Math.min(event.clientY, window.innerHeight - rect.height - 8);
      menu.style.left = `${Math.max(8, left)}px`;
      menu.style.top = `${Math.max(8, top)}px`;
      ctxMenu = menu;
      document.addEventListener('pointerdown', onCtxDismiss, true);
    };
    // ---- 菜单键：HID press 为唯一触发信号 ----
    // macOS 把遥控菜单键合成为「鼠标指针位置」的幻影右键 contextmenu（真机指纹
    // 2026-11-10：btn=2 buttons=0 detail=0，坐标随指针走、并非注入层记载的固定
    // (1,1)）。它先于 HID press 2~3ms 到达，一旦落入卡片分支会打开卡片菜单、
    // 吃掉紧随的 HID press——因此在 contextmenu 里按「无实体按键 + 无点击计数」
    // 签名识别并整个忽略；真实右键 buttons=2（mousedown 期）或 detail≥1，不受影响。
    const menuAction = () => {
      // 等同顶栏「管理/完成」按钮：进出管理模式（右键菜单开着则先关）
      if (ctxMenu) { closeCtxMenu(); return; }
      setManageMode(!manageMode);
    };
    document.addEventListener('contextmenu', (event) => {
      // 页面级屏蔽 WebKit 原生菜单（返回/重新载入/检查元素）：遥控器菜单键的
      // 幻影右键与空白处右键都不弹系统菜单；卡片右键走下方自研菜单。
      // 同款拦截见 local-reader index.ts 的 contextMenuGuard。
      event.preventDefault();
      // 菜单键幻影右键签名（坐标无关）：整个忽略，不触发也不开卡片菜单
      if (event.button === 2 && event.buttons === 0 && event.detail === 0) return;
      // Windows 菜单键（0x5D）会在聚焦卡片上触发 contextmenu，与「菜单键=管理模式」
      // 语义冲突；键盘触发 button=0，右键与 macOS ctrl+点击放行
      if (event.button !== 2 && !event.ctrlKey) return;
      const card = event.target?.closest?.('.book');
      if (!card || !card.dataset.bookId) return;
      if (manageMode) return;
      openCtxMenu(event, card);
    });
    // ---- 遥控器（电视式）：菜单/返回/主页/音量走 HID 事件通道 ----
    // 方向与 OK 由系统映射为 keydown（PageUp/PageDown/Arrow*/Enter）在下方键盘
    // 处理器消费，此处再认必双触发；故只消费这五键的 press 相位。
    window.__TAURI__?.event?.listen?.('remote-hid-button', (event) => {
      const { button, phase } = event.payload ?? {};
      if (phase !== 'press') return;
      if (button === 'menu') {
        menuAction();
        return;
      }
      if (button === 'back') {
        // 层层退出：右键菜单 → 管理模式 → 搜索词；书架无「离开」概念，到底即止
        if (ctxMenu) { closeCtxMenu(); return; }
        if (manageMode) { setManageMode(false); return; }
        const search = document.getElementById('search');
        if (search.value) {
          search.value = '';
          search.blur();
          applyFilter();
        }
        return;
      }
      if (button === 'home') { goTop(); return; }
      if (button === 'volume_up') { navScreen(-1); return; }
      if (button === 'volume_down') { navScreen(1); }
    });
    window.addEventListener('keydown', (event) => {
      // 搜索框/改名框中方向键归输入框（Escape 仍走下方清搜索分支）
      const inField = event.target instanceof HTMLInputElement;
      if (!ctxMenu && !inField && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown'].includes(event.key)) {
        if (navigateGrid(event.key)) event.preventDefault();
        return;
      }
      // OK/Enter 连发只认第一次：连发 click 会连环开书/连选
      if (event.key === 'Enter' && event.repeat && !inField) {
        event.preventDefault();
        return;
      }
      // 主页键：回顶部聚焦第一张（拦掉 body 原生滚动，HID home 事件同途）
      if (event.key === 'Home' && !inField) {
        event.preventDefault();
        goTop();
        return;
      }
      if (event.key === 'Escape') {
        // 管理模式下先退出管理；搜索有关键词时先清搜索
        if (manageMode) {
          setManageMode(false);
          return;
        }
        const search = document.getElementById('search');
        if (search.value) {
          search.value = '';
          applyFilter();
          search.focus();
        }
        return;
      }
      if (!invoke) return;
      if (isWindows && event.key === 'F11') {
        event.preventDefault();
        void invoke('simulate_menu_click', { action: 'toggle_fullscreen' });
        return;
      }
      if (!(event.metaKey || event.ctrlKey)) return;
      if (event.key >= '1' && event.key <= '7') {
        event.preventDefault();
        invoke('switch_bookstore_by_index', { index: Number(event.key) }).catch(() => {});
        return;
      }
      if (!isWindows || !event.ctrlKey) return;
      const key = event.key.toLowerCase();
      if (key === 'h') {
        event.preventDefault();
        void invoke('toggle_menu_bar');
        return;
      }
      const action = key === 'o' && event.shiftKey
        ? 'open_local_book'
        : windowsActions[key];
      if (!action) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      void invoke('simulate_menu_click', { action });
    }, true);
  </script>
  <!-- ⌘L 书城切换浮层（与注入页同款控制器，裸页直装） -->
  <script src="/bookstore-overlay.js"></script>
</body>
</html>
