<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>艾特阅读</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #1c201c;
      --ink: #edf0e9;
      --muted: #a6aa9e;
      --line: rgba(237, 240, 233, .16);
      --accent: #349f66;
      --halo: rgba(52, 159, 102, .12);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 46%, var(--halo), transparent 27rem),
        repeating-linear-gradient(0deg, transparent 0 39px, var(--line) 40px),
        var(--paper);
      font-family: "Songti SC", "Noto Serif CJK SC", STSong, serif;
    }
    main {
      width: min(640px, calc(100vw - 48px));
      text-align: center;
      animation: settle .7s cubic-bezier(.2, .8, .2, 1) both;
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 25px;
      background: var(--accent);
      -webkit-mask: url('/atrd-logo.svg') center / contain no-repeat;
      mask: url('/atrd-logo.svg') center / contain no-repeat;
      filter: drop-shadow(0 10px 24px rgba(52, 159, 102, .16));
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 60px);
      font-weight: 600;
      letter-spacing: .16em;
      text-indent: .16em;
      line-height: 1.2;
    }
    p {
      margin: 22px 0 0;
      color: var(--muted);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      letter-spacing: .08em;
    }
    .rule {
      width: 54px;
      height: 1px;
      margin: 22px auto 0;
      background: var(--accent);
      opacity: .8;
    }
    @keyframes settle {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>艾特阅读</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>当前没有已启用的在线插件</p>
  </main>
  <script>
    // 默认页没有阅读运行时，但仍必须保留应用级快捷键。
    const invoke = window.__TAURI__?.core?.invoke;
    const isWindows = navigator.userAgent.includes('Windows');
    const windowsActions = {
      ',': 'settings', r: 'refresh', '=': 'zoom_in', '-': 'zoom_out',
      '0': 'zoom_reset', o: 'hide_toolbar',
    };
    window.addEventListener('keydown', (event) => {
      if (!invoke) return;
      if (isWindows && event.key === 'F11') {
        event.preventDefault();
        void invoke('simulate_menu_click', { action: 'toggle_fullscreen' });
        return;
      }
      if (!(event.metaKey || event.ctrlKey)) return;
      if (event.key >= '1' && event.key <= '7') {
        event.preventDefault();
        // 焦点门禁在设置/编辑器窗口聚焦时拒绝切换，静默即可
        invoke('switch_bookstore_by_index', { index: Number(event.key) }).catch(() => {});
        return;
      }
      if (!isWindows || !event.ctrlKey) return;
      const key = event.key.toLowerCase();
      if (key === 'h') {
        event.preventDefault();
        void invoke('toggle_menu_bar');
        return;
      }
      const action = key === 'o' && event.shiftKey
        ? 'open_local_book'
        : windowsActions[key];
      if (!action) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      void invoke('simulate_menu_click', { action });
    }, true);
  </script>
</body>
</html>
