<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>艾特阅读</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #1c201c;
      --ink: #edf0e9;
      --muted: #a6aa9e;
      --line: rgba(237, 240, 233, .16);
      --accent: #81c9a2;
      --halo: rgba(129, 201, 162, .12);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 46%, var(--halo), transparent 27rem),
        repeating-linear-gradient(0deg, transparent 0 39px, var(--line) 40px),
        var(--paper);
      font-family: "Songti SC", "Noto Serif CJK SC", STSong, serif;
    }
    main {
      width: min(640px, calc(100vw - 48px));
      text-align: center;
      animation: settle .7s cubic-bezier(.2, .8, .2, 1) both;
    }
    .mark {
      width: 42px;
      height: 42px;
      margin: 0 auto 25px;
      position: relative;
      border: 1px solid var(--accent);
      border-radius: 50% 50% 48% 48%;
      transform: rotate(45deg);
    }
    .mark::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid var(--accent);
      border-radius: 50%;
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 60px);
      font-weight: 600;
      letter-spacing: .16em;
      text-indent: .16em;
      line-height: 1.2;
    }
    p {
      margin: 22px 0 0;
      color: var(--muted);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      letter-spacing: .08em;
    }
    .rule {
      width: 54px;
      height: 1px;
      margin: 22px auto 0;
      background: var(--accent);
      opacity: .8;
    }
    @keyframes settle {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>艾特阅读</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>当前没有已启用的在线插件</p>
  </main>
</body>
</html>
